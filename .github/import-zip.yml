name: Importar loja automaticamente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair pacote
        run: |
          unzip -o restart-corporal-patch.zip -d .
          rm restart-corporal-patch.zip

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar nova estrutura da loja" || echo "Sem alterações"
          git push